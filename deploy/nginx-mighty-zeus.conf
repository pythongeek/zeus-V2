# Zeus Slot — nginx vhost (production copy for the game subdomain).
# Install: cp deploy/nginx-mighty-zeus.conf /etc/nginx/sites-available/mighty-zeus
#          ln -s ../sites-available/mighty-zeus /etc/nginx/sites-enabled/
# TLS lines below are managed by Certbot (certbot --nginx -d mighty-zeus.megaslot.online);
# on a fresh server, start from the port-80 server block and let Certbot add the 443 block.
# mighty-zeus.megaslot.online — Zeus Slot Game alias
server {
    server_name mighty-zeus.megaslot.online;

    access_log /var/log/nginx/mighty-zeus.access.log;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mighty-zeus.megaslot.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mighty-zeus.megaslot.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = mighty-zeus.megaslot.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mighty-zeus.megaslot.online;
    return 404; # managed by Certbot


}